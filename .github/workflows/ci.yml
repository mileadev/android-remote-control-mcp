name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The five jobs below are independent — none consumes another's artifacts; each checks out
# fresh, rebuilds its native deps from cache, and runs its own Gradle tasks. They therefore run
# in PARALLEL on separate runners instead of in a needs: chain, cutting wall-clock from the sum
# of their durations (~36 min) to the longest single job (~13 min). The former chain existed only
# as a fail-fast gate; we trade that for faster feedback. Do NOT re-add needs: unless a real
# artifact dependency is introduced.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # fail if gradle-wrapper.jar is not an official Gradle wrapper JAR
          validate-wrappers: true

      - name: Cache ngrok-java JAR
        id: cache-ngrok-jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
          key: ngrok-jar-v2-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/src/**') }}

      - name: Build ngrok-java JAR (required for Gradle classpath)
        if: steps.cache-ngrok-jar.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  test-unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache ngrok-java host native build
        id: cache-ngrok-host
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-host.jar
            vendor/ngrok-java/ngrok-java-native/target/release/libngrok_java.so
            vendor/ngrok-java/ngrok-java-native/target/release/libngrok_java.dylib
          key: ngrok-host-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Cache Maven repository
        if: steps.cache-ngrok-host.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up Rust
        if: steps.cache-ngrok-host.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # fail if gradle-wrapper.jar is not an official Gradle wrapper JAR
          validate-wrappers: true

      - name: Install cloudflared (pinned)
        env:
          CLOUDFLARED_VERSION: "2026.10.0"
          # sha256 verified locally over both the standalone release asset and the
          # binary payload of the matching cloudflared-linux-amd64.deb (2026.10.0)
          CLOUDFLARED_SHA256: "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db"
        run: |
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          echo "${CLOUDFLARED_SHA256}  /usr/local/bin/cloudflared" | sha256sum --check --status
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Build ngrok-java JAR and host native library (for JVM tests)
        if: steps.cache-ngrok-host.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
          (cd ngrok-java-native && cargo build --release)
          (cd ngrok-java-native/target/release && jar cf ../ngrok-java-native-host.jar $(ls libngrok_java.so libngrok_java.dylib 2>/dev/null))
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Run unit tests with coverage
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: ./gradlew :app:test :privacy:test :privacy-benchmark:test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 14

  station-tests:
    name: Station Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Matches the version the other Python-using jobs in this repo pin.
          python-version: '3.12'

      # The station is pure standard-library Python, so nothing to install. It carries the
      # lease/attestation/quarantine enforcement for the lab, and until now no workflow ran
      # its suite, so a broken gate could reach main unnoticed.
      - name: Run station unit tests
        run: python3 -m unittest discover -s station/tests -t . -v

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # fail if gradle-wrapper.jar is not an official Gradle wrapper JAR
          validate-wrappers: true

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      - name: Build gms debug APK (required by E2E tests)
        run: ./gradlew assembleGmsDebug

      - name: Set up Android platform-tools (adb)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Checking for platform-tools..."
          ls -la "$ANDROID_HOME/platform-tools/adb" 2>/dev/null || echo "adb not found at $ANDROID_HOME/platform-tools/"
          ls "$ANDROID_HOME/" 2>/dev/null || echo "ANDROID_HOME directory not found"
          # Install platform-tools if not present
          if [ ! -f "$ANDROID_HOME/platform-tools/adb" ]; then
            echo "Installing platform-tools via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" 2>/dev/null || \
              sudo apt-get install -y -qq android-sdk-platform-tools 2>/dev/null || \
              { echo "ERROR: Could not install platform-tools"; exit 1; }
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Set up redroid kernel modules
        run: |
          # Install kernel module package (binder_linux is in linux-modules-extra)
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
          # Load required kernel modules
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe fuse
          # Mount binderfs if not already mounted
          if ! mountpoint -q /dev/binderfs; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binder binder /dev/binderfs
          fi
          # Verify
          ls -la /dev/binderfs/
          lsmod | grep -E 'binder_linux|fuse'

      - name: Set up rootful podman socket
        run: |
          sudo apt-get install -y -qq podman
          sudo systemctl enable --now podman.socket
          sudo chmod 755 /run/podman
          # Runner-owned socket instead of world-write (chmod 666 is never used on container sockets)
          sudo chown "$(id -un):$(id -gn)" /run/podman/podman.sock
          sudo chmod 660 /run/podman/podman.sock
          # Verify socket is accessible without sudo and NOT world-writable
          curl -s --unix-socket /run/podman/podman.sock http://localhost/_ping
          test "$(stat -c %a /run/podman/podman.sock)" = "660"

      - name: Pre-pull redroid image
        run: sudo podman pull redroid/redroid:14.0.0-latest

      - name: Run E2E tests
        env:
          DOCKER_HOST: unix:///run/podman/podman.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./gradlew :e2e-tests:test

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-test-results
          path: e2e-tests/build/reports/tests/
          retention-days: 14

  build-release:
    name: Build Release - ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One runner per flavour so gms and foss assemble in parallel instead of one job
    # building all four APKs serially. fail-fast off: a foss break must not cancel gms.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gms
            label: GMS
            cap: Gms
          - flavor: foss
            label: FOSS
            cap: Foss
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback). On
          # pull_request runs this reflects the ephemeral merge ref, not the post-merge
          # main commit; these artifacts are unsigned and never shipped.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # fail if gradle-wrapper.jar is not an official Gradle wrapper JAR
          validate-wrappers: true

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      - name: Build ${{ matrix.label }} debug + release APKs
        run: ./gradlew assemble${{ matrix.cap }}Debug assemble${{ matrix.cap }}Release

      - name: Upload ${{ matrix.label }} debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk
          retention-days: 30

      - name: Upload ${{ matrix.label }} release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release-unsigned.apk
          retention-days: 30
